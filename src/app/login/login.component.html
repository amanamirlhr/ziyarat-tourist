<div class="row justify-content-center">
  <div class="col-md-4 p-3">
    <div class="card p-3 card-container">
      <div  class="logo_image_css">
        <img mat-card-image src="../../assets/Images/Log-Ziyara.png" width="200" alt="Ziyarat Logo">
    </div>
      <form
        *ngIf="!isLoggedIn"
        name="form"
        (ngSubmit)="f.form.valid && onSubmit()"
        #f="ngForm"
        novalidate
      >
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="text"
            class="form-control"
            name="email"
            [(ngModel)]="form.email"
            required
            #email="ngModel"
            [ngClass]="{ 'is-invalid': f.submitted && email.errors }" placeholder="Please enter a email"
          />
          <div *ngIf="email.errors && f.submitted" class="invalid-feedback">
            email is required!
          </div>
        </div>
        <div class="form-group mt-3">
          <label for="password">Password</label>
          <input
            type="password"
            class="form-control"
            name="password"
            [(ngModel)]="form.password"
            required
            minlength="3"
            #password="ngModel"
            [ngClass]="{ 'is-invalid': f.submitted && password.errors }"  placeholder="Please enter a password"
          />
          <div *ngIf="password.errors && f.submitted" class="invalid-feedback">
            <div *ngIf="password.errors['required']">Password is required</div>
            <div *ngIf="password.errors['minlength']">
              Password must be at least 3 characters
            </div>
          </div>
        </div>
        <div class="mt-3 text-center">
          <button mat-raised-button class="btn login_color">Login</button>
        </div>
        <div class="form-group">
          <div *ngIf="f.submitted && isLoginFailed" class="alert alert-danger" role="alert">
            Login failed: {{ errorMessage }}
          </div>
        </div>
      </form>
  
      <div class="alert alert-success" *ngIf="isLoggedIn">
        Logged in as {{ roles }}.
      </div>
    </div>
  </div>
</div>
