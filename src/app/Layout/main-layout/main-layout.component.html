<mat-toolbar class="example_toolbar">
    <img class="logo_header_css" src="../../../assets/Images/Log-Ziyara.png" width="200" alt="Ziyarat Logo" />
    <button mat-icon-button class="header_primary_color"
        (click)="isExpanded = !isExpanded"><mat-icon>menu</mat-icon></button>
    <button class="user-view-header" mat-button [matMenuTriggerFor]="menu" #menuTrigger>Menu</button>

    <mat-menu #menu="matMenu">
        <button mat-menu-item><i class="fa fa-user-circle-o" aria-hidden="true"></i> Profile</button>
        <a mat-menu-item href="/login"><i class="fa fa-sign-out" aria-hidden="true"></i> Logout</a>
    </mat-menu>
</mat-toolbar>
<mat-sidenav-container class="Touriest_container" autosize>
    <mat-sidenav #sidenav class="Touriest_sidenav" mode="side" opened="true" (mouseenter)="mouseenter()"
        (mouseleave)="mouseleave()">
        <mat-nav-list>
            <mat-list-item class="parent" [ngClass]="{ 'active': activeItem === '/' }">
                <span class="full-width" *ngIf="isExpanded || isShowing"><a
                        mat-list-item class="sidebar_primary_color" routerLink="/" (click)="setActiveItem('/')"><i class="fa fa-tachometer me-3 sidebaricons"></i> Dashboard</a></span>
            </mat-list-item>
            <mat-list-item class="parent mt-3" [ngClass]="{ 'active': activeItem === 'tours' }">
                <span class="full-width" *ngIf="isExpanded || isShowing"><a
                        mat-list-item class="sidebar_primary_color" routerLink="/tours" (click)="setActiveItem('tours')"><i class="fa fa-plane me-3 sidebaricons"></i>  Tours</a></span>
            </mat-list-item>
            <mat-list-item class="parent mt-3" [ngClass]="{ 'active': activeItem === 'touriest' }">
                <span class="full-width" *ngIf="isExpanded || isShowing"><a
                        mat-list-item class="sidebar_primary_color" routerLink="/touriest" (click)="setActiveItem('touriest')"><i class="fa fa-users me-3 sidebaricons"></i> Tourist</a></span>
            </mat-list-item>
            <mat-list-item class="parent mt-3" [ngClass]="{ 'active': activeItem === 'countries' }">
                <span class="full-width" *ngIf="isExpanded || isShowing"><a
                        mat-list-item class="sidebar_primary_color" routerLink="/countries" (click)="setActiveItem('countries')"><i class="fa fa-globe me-3 sidebaricons"></i> Countries</a></span>
            </mat-list-item>
            <mat-list-item class="parent mt-3" [ngClass]="{ 'active': activeItem === 'expenses' }">
                <span class="full-width" *ngIf="isExpanded || isShowing"><a
                        mat-list-item class="sidebar_primary_color" routerLink="/expenses" (click)="setActiveItem('expenses')"><i class="fa fa-credit-card-alt me-3 sidebaricons"></i> Expenses</a></span>
            </mat-list-item>
        </mat-nav-list>
        <mat-nav-list>
        </mat-nav-list>
    </mat-sidenav>

    <div class="example-sidenav-content">
        <router-outlet></router-outlet>
    </div>

</mat-sidenav-container>
